name: ATLAS Laboratory market watch

on:
  push:
    branches: [main]
    paths: ["research-watch.py", "screening-pulse.py", ".github/workflows/atlas-research-watch.yml"]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: atlas-laboratory-market-watch
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - name: Checkout monitor code
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout isolated public monitoring snapshots
        uses: actions/checkout@v4
        with:
          ref: research-monitor
          path: snapshots

      - name: Set up Python for the screening runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned screening dependencies
        continue-on-error: true
        run: |
          python -m pip install -q --disable-pip-version-check --only-binary=:all: \
            --target "$RUNNER_TEMP/atlas-screen-deps" \
            numpy==2.4.6 numba==0.66.0 llvmlite==0.48.0

      - name: Run historical screening every five minutes and keep the 30-minute market watch
        id: watch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ATLAS_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          git -C snapshots config user.name atlas-research-watch
          git -C snapshots config user.email atlas-research-watch@users.noreply.github.com
          echo "continue=true" >> "$GITHUB_OUTPUT"
          started="$(date -u +%s)"
          next_boundary="$(( (started / 300 + 1) * 300 + 15 ))"
          pulses=48
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then pulses=1; fi
          failures=0
          for ((pulse=1; pulse<=pulses; pulse++)); do
            if ! python source/research-watch.py --output snapshots/monitor.json; then
              echo "::warning::Market check failed. The next pulse retries."
              failures=$((failures + 1))
            fi
            if ! python source/screening-pulse.py \
              --work-dir "$RUNNER_TEMP/atlas-screen-worker" \
              --dependency-dir "$RUNNER_TEMP/atlas-screen-deps" \
              --output snapshots/screening-5m.json; then
              echo "::warning::Screening pulse failed. The next pulse retries."
              failures=$((failures + 1))
            fi
            for snapshot in monitor.json screening-5m.json evolution-memory.json screening-proposals.json exploration-state.json lab-v2-state.json; do
              if [[ -f "snapshots/$snapshot" ]]; then git -C snapshots add "$snapshot"; fi
            done
            if ! git -C snapshots diff --cached --quiet; then
              git -C snapshots commit -m "Record ATLAS Laboratory screening pulse"
            fi
            if git -C snapshots push origin HEAD:refs/heads/research-monitor; then
              python source/screening-pulse.py \
                --work-dir "$RUNNER_TEMP/atlas-screen-worker" \
                --dependency-dir "$RUNNER_TEMP/atlas-screen-deps" \
                --output snapshots/screening-5m.json --dispatch-only
              git -C snapshots add screening-5m.json
              if ! git -C snapshots diff --cached --quiet; then
                git -C snapshots commit -m "Record autonomous PAPER handoff status"
                git -C snapshots push origin HEAD:refs/heads/research-monitor || \
                  echo "::warning::PAPER handoff status publication will be retried."
              fi
            else
              echo "::warning::Snapshot push failed. The next pulse retries without force."
              failures=$((failures + 1))
            fi
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then break; fi
            target="$((next_boundary + (pulse - 1) * 300))"
            now="$(date -u +%s)"
            if (( target > now )); then sleep "$((target - now))"; fi
          done
          if (( failures > 0 )); then exit 1; fi

      - name: Queue the next monitoring window
        if: ${{ always() && steps.watch.outputs.continue == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run atlas-research-watch.yml --repo "$GITHUB_REPOSITORY" --ref main; then exit 0; fi
            if (( attempt < 3 )); then sleep 10; fi
          done
          exit 1
