name: ATLAS cloud heartbeat

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atlas-heartbeat.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: atlas-cloud-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      BOT_REPOSITORY: mondaytv/atlas-bot
      BOT_WORKFLOW: atlas.yml
      PULSE_SECONDS: "1800"
      TEST_UNTIL: "2026-12-03T08:00:00Z"
      WINDOW_SECONDS: "14400"
    steps:
      - name: Dispatch ATLAS stop checks and candle-close cycles
        id: relay
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ATLAS_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::ATLAS_TRIGGER_TOKEN is not configured"
            exit 1
          fi

          echo "safe_restart=true" >> "$GITHUB_OUTPUT"
          end_epoch="$(date -u -d "$TEST_UNTIL" +%s)"
          window_end="$(( $(date -u +%s) + WINDOW_SECONDS ))"

          # The private engine spends Actions minutes on every start. Start it
          # only when it has work: a new 4-hour candle since the last full cycle,
          # or open positions that need 30-minute stop checks. Unreadable data
          # fails open (dispatch), so a broken feed never silences the engine.
          engine_has_work() {
            python3 - <<'PY'
          import datetime, json, time, urllib.request
          now = time.time()
          try:
              request = urllib.request.Request(
                  "https://raw.githubusercontent.com/mondaytv/atlas-dashboard/data/strategies.json?t=%d" % now,
                  headers={"Cache-Control": "no-cache", "User-Agent": "ATLAS-heartbeat"})
              data = json.load(urllib.request.urlopen(request, timeout=20))
              open_positions = sum(int(row.get("open_positions") or 0) for row in data.get("strategies", []))
              last = data.get("last_signal_cycle_at") or (data.get("generated_at") if data.get("cycle_mode") == "SIGNAL" else None)
              last_ts = datetime.datetime.fromisoformat(last.replace("Z", "+00:00")).timestamp() if last else None
          except Exception as error:
              print(f"Dispatch: public data unreadable ({type(error).__name__})")
              raise SystemExit(0)
          if open_positions:
              print(f"Dispatch: {open_positions} open position(s) need stop checks")
              raise SystemExit(0)
          if last_ts is None or last_ts < now // 14400 * 14400:
              print("Dispatch: a new 4-hour candle cycle is due")
              raise SystemExit(0)
          print("Skip: books are flat and this 4-hour cycle is done")
          raise SystemExit(1)
          PY
          }

          dispatch_atlas() {
            for attempt in 1 2 3; do
              if gh workflow run "$BOT_WORKFLOW" --repo "$BOT_REPOSITORY" --ref main; then
                echo "ATLAS paper check dispatched at $(date -u --iso-8601=seconds)"
                return 0
              fi
              if (( attempt < 3 )); then sleep 20; fi
            done
            return 1
          }

          failures=0
          while :; do
            now="$(date -u +%s)"
            if (( now >= end_epoch )); then
              echo "Thirty-day test deadline reached; sending final cleanup cycle"
              dispatch_atlas || failures=$((failures + 1))
              break
            fi

            if engine_has_work; then
              dispatch_atlas || failures=$((failures + 1))
            fi
            next_pulse="$((now + PULSE_SECONDS))"
            if (( next_pulse >= window_end )); then
              # Keep relay windows exactly four hours apart.  Exiting here
              # immediately used to start the next window 30 minutes early,
              # producing two dispatches in the same pulse bucket.
              boundary_wait="$((window_end - now))"
              if (( boundary_wait > 0 )); then sleep "$boundary_wait"; fi
              break
            fi
            sleep_for="$PULSE_SECONDS"
            if (( now + sleep_for > end_epoch )); then sleep_for="$((end_epoch - now))"; fi
            if (( sleep_for > 0 )); then sleep "$sleep_for"; fi
          done

          if (( failures > 0 )); then
            echo "::error::$failures ATLAS dispatches failed"
            exit 1
          fi

      - name: Notify heartbeat failure
        if: ${{ failure() }}
        shell: bash
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "${NTFY_URL:-}" ]; then
            echo "::warning::NTFY_URL is not configured; notification skipped"
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Title: ATLAS heartbeat failure" \
            -H "Priority: high" \
            -d "Public relay failed; run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$NTFY_URL" || echo "::warning::ntfy notification failed"

      - name: Start the next free relay window
        if: ${{ always() && steps.relay.outputs.safe_restart == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          end_epoch="$(date -u -d "$TEST_UNTIL" +%s)"
          if (( now < end_epoch )); then
            gh workflow run atlas-heartbeat.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Next ATLAS relay window queued"
          else
            echo "Thirty-day test finished; relay stopped"
          fi

