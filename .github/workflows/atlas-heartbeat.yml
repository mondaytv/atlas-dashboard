name: ATLAS cloud heartbeat

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atlas-heartbeat.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: atlas-cloud-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      BOT_REPOSITORY: mondaytv/atlas-bot
      BOT_WORKFLOW: atlas.yml
      PULSE_SECONDS: "1800"
      TEST_UNTIL: "2026-12-03T08:00:00Z"
      WINDOW_SECONDS: "14400"
    steps:
      - name: Dispatch ATLAS stop checks and candle-close cycles
        id: relay
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ATLAS_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::ATLAS_TRIGGER_TOKEN is not configured"
            exit 1
          fi

          echo "safe_restart=true" >> "$GITHUB_OUTPUT"
          end_epoch="$(date -u -d "$TEST_UNTIL" +%s)"
          window_end="$(( $(date -u +%s) + WINDOW_SECONDS ))"

          dispatch_atlas() {
            for attempt in 1 2 3; do
              if gh workflow run "$BOT_WORKFLOW" --repo "$BOT_REPOSITORY" --ref main; then
                echo "ATLAS paper check dispatched at $(date -u --iso-8601=seconds)"
                return 0
              fi
              if (( attempt < 3 )); then sleep 20; fi
            done
            return 1
          }

          failures=0
          while :; do
            now="$(date -u +%s)"
            if (( now >= end_epoch )); then
              echo "Thirty-day test deadline reached; sending final cleanup cycle"
              dispatch_atlas || failures=$((failures + 1))
              break
            fi

            dispatch_atlas || failures=$((failures + 1))
            next_pulse="$((now + PULSE_SECONDS))"
            if (( next_pulse >= window_end )); then
              # Keep relay windows exactly four hours apart.  Exiting here
              # immediately used to start the next window 30 minutes early,
              # producing two dispatches in the same pulse bucket.
              boundary_wait="$((window_end - now))"
              if (( boundary_wait > 0 )); then sleep "$boundary_wait"; fi
              break
            fi
            sleep_for="$PULSE_SECONDS"
            if (( now + sleep_for > end_epoch )); then sleep_for="$((end_epoch - now))"; fi
            if (( sleep_for > 0 )); then sleep "$sleep_for"; fi
          done

          if (( failures > 0 )); then
            echo "::error::$failures ATLAS dispatches failed"
            exit 1
          fi

      - name: Notify heartbeat failure
        if: ${{ failure() }}
        shell: bash
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "${NTFY_URL:-}" ]; then
            echo "::warning::NTFY_URL is not configured; notification skipped"
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Title: ATLAS heartbeat failure" \
            -H "Priority: high" \
            -d "Public relay failed; run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$NTFY_URL" || echo "::warning::ntfy notification failed"

      - name: Start the next free relay window
        if: ${{ always() && steps.relay.outputs.safe_restart == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          end_epoch="$(date -u -d "$TEST_UNTIL" +%s)"
          if (( now < end_epoch )); then
            gh workflow run atlas-heartbeat.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Next ATLAS relay window queued"
          else
            echo "Thirty-day test finished; relay stopped"
          fi

